<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenImpact Connect | DTID Emerging Technology Division</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root {
  --dk:#0C3E4D; --md:#26727A; --lt:#D8ECEF; --xlt:#F0F6F7;
  --wh:#FFFFFF; --bk:#1A1A1A; --am:#BA7517; --gn:#1B8C4E;
  --rd:#7A2010; --gr:#607D8B;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Calibri,sans-serif;}
body{background:var(--xlt);color:var(--bk);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
/* HEADER */
header{background:var(--dk);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:34px;height:34px;background:var(--md);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:19px;font-weight:700;}
.logo-sub{font-size:10px;color:var(--lt);letter-spacing:.6px;margin-top:1px;}
.header-right{font-size:11px;color:var(--lt);text-align:right;line-height:1.5;}
.badge{background:var(--am);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:2px;}
/* LAYOUT */
.app{display:flex;height:calc(100vh - 56px - 34px);overflow:hidden;}
/* NAV */
nav{width:210px;background:var(--dk);padding:16px 0;flex-shrink:0;overflow-y:auto;}
.nav-section{font-size:10px;color:#5a8a96;font-weight:700;letter-spacing:1.2px;padding:12px 18px 5px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:#a8cdd4;font-size:13px;transition:all .15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(38,114,122,.3);color:#fff;border-left-color:var(--md);}
.nav-icon{width:20px;text-align:center;font-size:15px;}
.nav-badge{background:var(--gn);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:auto;}
/* MAIN */
main{flex:1;overflow-y:auto;padding:24px 28px;}
.page-title{font-size:21px;font-weight:700;color:var(--dk);margin-bottom:3px;}
.page-sub{font-size:12.5px;color:var(--gr);margin-bottom:20px;}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{background:#fff;border-radius:10px;padding:18px 20px;border-top:4px solid var(--md);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.kpi-card.amber{border-top-color:var(--am);}
.kpi-card.green{border-top-color:var(--gn);}
.kpi-value{font-size:30px;font-weight:800;color:var(--dk);line-height:1;}
.kpi-label{font-size:11.5px;color:var(--gr);margin-top:5px;font-weight:500;}
.kpi-delta{font-size:11px;color:var(--gn);margin-top:3px;}
/* CARD */
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:18px;}
.card-title{font-size:13.5px;font-weight:700;color:var(--dk);margin-bottom:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--lt);padding-bottom:9px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{background:var(--dk);color:#fff;padding:9px 11px;text-align:left;font-weight:600;font-size:11.5px;}
td{padding:8px 11px;border-bottom:1px solid #eef2f3;vertical-align:middle;}
tr:hover td{background:var(--xlt);}
tr:last-child td{border-bottom:none;}
/* STATUS */
.status{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.status.funded{background:#e6f4ed;color:var(--gn);}
.status.matched{background:#e8f4f5;color:var(--md);}
.status.review{background:#fef6e6;color:var(--am);}
.status.pending{background:#f5ece9;color:var(--rd);}
.status.success{background:#e6f4ed;color:var(--gn);font-size:13px;padding:4px 14px;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
/* SCORE */
.score-wrap{display:flex;align-items:center;gap:7px;}
.score-bar{flex:1;height:5px;background:var(--lt);border-radius:3px;overflow:hidden;min-width:60px;}
.score-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--md),var(--gn));}
.score-num{font-size:12px;font-weight:700;color:var(--dk);min-width:30px;}
/* SEARCH */
.search-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;}
.search-input{flex:1;padding:8px 13px;border:1.5px solid var(--lt);border-radius:7px;font-size:13px;background:#fff;outline:none;transition:border .15s;}
.search-input:focus{border-color:var(--md);}
.filter-select{padding:8px 12px;border:1.5px solid var(--lt);border-radius:7px;font-size:12.5px;background:#fff;color:var(--bk);outline:none;cursor:pointer;}
.btn{padding:8px 16px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn-teal{background:var(--md);color:#fff;}
.btn-green{background:var(--gn);color:#fff;}
.no-results{text-align:center;padding:32px;color:var(--gr);font-size:13px;}
/* FLOW */
.flow{display:flex;align-items:stretch;gap:0;margin:14px 0;}
.flow-step{flex:1;text-align:center;padding:10px 6px;background:var(--xlt);border:1px solid var(--lt);font-size:11.5px;position:relative;}
.flow-step.done{background:#e6f4ed;border-color:#b2ddc4;}
.flow-step.active-step{background:var(--lt);border-color:var(--md);}
.flow-num{font-size:16px;font-weight:800;color:var(--md);display:block;margin-bottom:3px;}
.flow-step.done .flow-num{color:var(--gn);}
.flow-arrow{color:var(--md);font-size:16px;display:flex;align-items:center;padding:0 2px;}
/* MATCH */
.match-result{background:linear-gradient(135deg,var(--dk),var(--md));color:#fff;border-radius:12px;padding:22px;text-align:center;margin:16px 0;}
.match-score-big{font-size:60px;font-weight:900;line-height:1;}
.match-label{font-size:13px;opacity:.8;margin-top:5px;}
.match-gate{font-size:11.5px;background:rgba(255,255,255,.15);border-radius:5px;padding:5px 12px;display:inline-block;margin-top:8px;}
.gate-ok{color:#7effc0;}
/* ATTR */
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.attr-row{display:flex;align-items:center;padding:6px 10px;background:var(--xlt);border-radius:5px;font-size:12px;gap:8px;}
.attr-key{font-weight:700;color:var(--md);min-width:22px;}
.attr-val{flex:1;color:var(--bk);}
.attr-w{color:var(--am);font-weight:700;font-size:11px;}
/* INVESTOR */
.inv-card{background:linear-gradient(135deg,var(--dk),var(--md));color:#fff;border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.inv-name{font-size:19px;font-weight:800;}
.inv-meta{font-size:12px;opacity:.75;margin-top:3px;}
.crit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px;}
.crit-item{background:rgba(255,255,255,.12);border-radius:7px;padding:9px 11px;}
.crit-label{font-size:10px;opacity:.7;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.crit-val{font-size:12.5px;font-weight:600;}
/* DLT */
.tx-grid{display:grid;grid-template-columns:190px 1fr;}
.tx-key{background:var(--lt);padding:8px 13px;font-size:11.5px;font-weight:700;color:var(--dk);border-bottom:1px solid #c8dfe3;}
.tx-val{background:#fff;padding:8px 13px;font-size:12px;border-bottom:1px solid #eef2f3;word-break:break-all;}
.tx-mono{font-family:'Consolas',monospace;font-size:11px;color:var(--md);}
.tranche-track{display:flex;margin-top:6px;}
.tr-item{flex:1;text-align:center;padding:9px 6px;font-size:11px;font-weight:700;border:1px solid #ddd;}
.tr-item.done{background:var(--gn);color:#fff;border-color:var(--gn);}
.tr-item.now{background:var(--am);color:#fff;border-color:var(--am);}
.tr-item.wait{background:#fff;color:var(--gr);}
.tr-item:first-child{border-radius:6px 0 0 6px;}
.tr-item:last-child{border-radius:0 6px 6px 0;}
.oracle-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--lt);font-size:12.5px;}
.oracle-check{color:var(--gn);font-weight:700;font-size:15px;flex-shrink:0;}
.info-banner{background:var(--lt);border-left:4px solid var(--md);padding:10px 14px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--dk);margin-bottom:14px;}
.warn-banner{background:#fef6e6;border-left:4px solid var(--am);padding:10px 14px;border-radius:0 6px 6px 0;font-size:12.5px;color:#7a4a00;margin-bottom:14px;}
/* STAGE PILL */
.s-pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11.5px;font-weight:700;color:#fff;}
.s-pill.o1{background:var(--md);}
.s-pill.o2{background:var(--gn);}
/* FOOTER */
footer{background:var(--dk);color:#5a8a96;font-size:10.5px;padding:0 28px;height:34px;line-height:34px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
/* TAG */
.tag{display:inline-block;background:var(--lt);color:var(--md);font-size:11px;padding:2px 8px;border-radius:8px;margin:1px;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:12px;padding:28px 30px;width:540px;max-width:94vw;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal-title{font-size:17px;font-weight:700;color:var(--dk);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--gr);margin-bottom:20px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-label{font-size:11.5px;font-weight:700;color:var(--dk);}
.form-input,.form-select{padding:8px 11px;border:1.5px solid var(--lt);border-radius:7px;font-size:13px;background:#fff;outline:none;transition:border .15s;font-family:inherit;}
.form-input:focus,.form-select:focus{border-color:var(--md);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.btn-ghost{background:#fff;border:1.5px solid var(--lt);color:var(--gr);padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
.form-note{font-size:11px;color:var(--gr);grid-column:1/-1;background:var(--xlt);padding:8px 10px;border-radius:5px;}

/* ── ZOOM OVERLAY ─────────────────────────────────────────────────────────── */
.zoom-overlay{position:fixed;inset:0;background:var(--xlt);z-index:900;display:flex;flex-direction:column;overflow:hidden;}
.zoom-enter{animation:zoomIn .3s cubic-bezier(.2,0,0,1) forwards;}
.zoom-exit{animation:zoomOut .22s cubic-bezier(.4,0,1,1) forwards;}
@keyframes zoomIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes zoomOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.96) translateY(12px)}}
.screen-slide-in{animation:slideIn .25s cubic-bezier(.2,0,0,1) forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
.screen-slide-back{animation:slideBack .25s cubic-bezier(.2,0,0,1) forwards;}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
.zoom-bar{background:var(--dk);color:#fff;padding:0 22px;height:50px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.zoom-back-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:5px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:6px;}
.zoom-back-btn:hover{background:rgba(255,255,255,.2);}
.zoom-stage-label{font-size:13px;font-weight:700;color:#fff;flex:1;text-align:center;}
.zoom-stage-sub{font-size:10px;opacity:.6;text-align:center;}
.zoom-dots{display:flex;gap:6px;align-items:center;}
.zoom-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .22s;cursor:pointer;}
.zoom-dot.on{background:var(--am);width:20px;border-radius:3.5px;}
.zoom-nav-btns{display:flex;gap:10px;}
.zoom-nav-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;height:38px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.zoom-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.45);}
.zoom-nav-btn:disabled{opacity:.25;cursor:not-allowed;}
.zoom-nav-btn.next{background:var(--am);border-color:var(--am);}
.zoom-nav-btn.next:hover:not(:disabled){background:#cf8820;border-color:#cf8820;}
.zoom-content{flex:1;overflow-y:auto;padding:24px 28px;}
.zoom-key-hint{font-size:10px;opacity:.45;font-family:'Consolas',monospace;white-space:nowrap;}

/* ── FLOW DIAGRAM ─────────────────────────────────────────────────────────── */
.flow-diagram{display:flex;align-items:flex-start;padding:20px 0 8px;position:relative;}
.flow-node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;}
.flow-card{background:#fff;border-radius:14px;padding:18px 10px 14px;text-align:center;width:calc(100% - 12px);box-shadow:0 3px 14px rgba(12,62,77,.10);border:2px solid var(--lt);transition:all .22s;cursor:pointer;}
.flow-card:hover{border-color:var(--md);box-shadow:0 8px 28px rgba(38,114,122,.22);transform:translateY(-5px);}
.flow-card:active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(38,114,122,.18);}
.flow-num{width:34px;height:34px;background:linear-gradient(135deg,var(--md),var(--dk));border-radius:50%;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 2px 8px rgba(38,114,122,.3);}
.flow-icon{font-size:22px;margin-bottom:7px;}
.flow-title{font-weight:700;font-size:12.5px;color:var(--dk);margin-bottom:5px;line-height:1.3;}
.flow-desc{font-size:10.5px;color:var(--gr);line-height:1.5;margin-bottom:8px;}
.flow-cta{font-size:11px;font-weight:700;color:var(--md);}
.flow-connector{flex:0 0 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:46px;position:relative;}
.flow-line{width:32px;height:2px;background:linear-gradient(90deg,var(--md),var(--lt));position:relative;overflow:visible;}
.flow-pulse{position:absolute;top:-4px;left:-2px;width:10px;height:10px;border-radius:50%;background:var(--am);animation:dataPulse 1.9s infinite ease-in-out;}
.flow-pulse:nth-child(2){animation-delay:.63s;opacity:.7;}
.flow-pulse:nth-child(3){animation-delay:1.26s;opacity:.4;}
@keyframes dataPulse{0%{left:-2px;opacity:1;transform:scale(1)}80%{left:26px;opacity:.3;transform:scale(.6)}100%{left:28px;opacity:0;transform:scale(.4)}}
.flow-arrowhead{font-size:13px;color:var(--md);position:absolute;right:-8px;top:50%;transform:translateY(-50%);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ─── SEED DATA ───────────────────────────────────────────────────────────────
const SEED_PROJECTS = [
  { id:'SC-KE-2026-0041', name:'Kisumu Solar Hub',          country:'Kenya',       flag:'🇰🇪', tech:'Solar PV',              capital:'$75,000',  score:87, status:'funded',  statusLabel:'Funded (T2/4)', sdgs:['SDG 7','SDG 13'],           co2:'340 tCO₂e/yr', ipRef:'Distributed renewables (#147587)',          ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/147587' },
  { id:'SC-IN-2026-0008', name:'Rajasthan Solar Irrigation', country:'India',       flag:'🇮🇳', tech:'Solar PV',              capital:'$120,000', score:85, status:'funded',  statusLabel:'Funded (T1/3)', sdgs:['SDG 7','SDG 13','SDG 8'],    co2:'520 tCO₂e/yr', ipRef:'Modular solar systems (#149356)',            ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/149356' },
  { id:'SC-PH-2026-0033', name:'Bohol Mangrove Restoration', country:'Philippines', flag:'🇵🇭', tech:'Blue Carbon',           capital:'$95,000',  score:81, status:'matched', statusLabel:'Matched',        sdgs:['SDG 14','SDG 15','SDG 13'], co2:'210 tCO₂e/yr', ipRef:'Blue carbon ecosystem program (#178442)',    ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/178442' },
  { id:'SC-RW-2026-0019', name:'Rwanda Cold Chain Network',  country:'Rwanda',      flag:'🇷🇼', tech:'Climate-Resilient Agri',capital:'$60,000',  score:73, status:'review',  statusLabel:'In Review',      sdgs:['SDG 8','SDG 13'],           co2:'95 tCO₂e/yr',  ipRef:'Cold Storage Box Portable (#172222)',        ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/172222' },
  { id:'SC-GH-2026-0027', name:'Accra Urban Wind',           country:'Ghana',       flag:'🇬🇭', tech:'Wind Energy',           capital:'$200,000', score:69, status:'pending', statusLabel:'Pipeline',       sdgs:['SDG 7','SDG 13'],           co2:'180 tCO₂e/yr', ipRef:'AVATAR Small Wind Turbine (#149296)',        ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/149296' },
  { id:'SC-NG-2026-0052', name:'Lagos Waste-to-Energy',      country:'Nigeria',     flag:'🇳🇬', tech:'Waste-to-Energy',       capital:'$340,000', score:64, status:'matched', statusLabel:'Matched',        sdgs:['SDG 11','SDG 13','SDG 17'], co2:'430 tCO₂e/yr', ipRef:'Biogas to Energy (#23712)',                  ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/23712' },
  { id:'SC-BD-2026-0011', name:'Sylhet Mini-Grid Network',   country:'Bangladesh',  flag:'🇧🇩', tech:'Solar PV',              capital:'$88,000',  score:62, status:'review',  statusLabel:'In Review',      sdgs:['SDG 7','SDG 1','SDG 13'],   co2:'155 tCO₂e/yr', ipRef:'Mini-grid connection network (#149359)',     ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/149359' },
  { id:'SC-MZ-2026-0066', name:'Sofala Mangrove Carbon',     country:'Mozambique',  flag:'🇲🇿', tech:'Blue Carbon',           capital:'$110,000', score:58, status:'pending', statusLabel:'Pipeline',       sdgs:['SDG 14','SDG 15','SDG 13'], co2:'275 tCO₂e/yr', ipRef:'Community mangrove replanting (#180071)',    ipUrl:'https://wipogreen.wipo.int/wipogreen-database/articles/180071' },
];

const TECH_OPTIONS = ['Solar PV','Blue Carbon','Climate-Resilient Agri','Wind Energy','Waste-to-Energy','Early Warning / Adaptation','Hydro','Geothermal'];
const TECHS = ['All Technologies',...TECH_OPTIONS];
const STATUSES = ['All Statuses','Funded','Matched','In Review','Pipeline'];
const COUNTRY_FLAGS = {Kenya:'🇰🇪',India:'🇮🇳',Philippines:'🇵🇭',Rwanda:'🇷🇼',Ghana:'🇬🇭',Nigeria:'🇳🇬',Tanzania:'🇹🇿',Uganda:'🇺🇬',Bangladesh:'🇧🇩',Vietnam:'🇻🇳',Indonesia:'🇮🇩',Cambodia:'🇰🇭',Ethiopia:'🇪🇹',Mozambique:'🇲🇿',Zambia:'🇿🇲',Other:'🌍'};

// Auto-generate a contract ID
let _idCounter = 53;
function genId(country) {
  const code = country.slice(0,2).toUpperCase();
  _idCounter++;
  return `SC-${code}-2026-0${_idCounter}`;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const ScoreBar = ({score}) => (
  <div className="score-wrap">
    <div className="score-bar"><div className="score-fill" style={{width:`${score}%`}}/></div>
    <span className="score-num">{score}%</span>
  </div>
);
const Status = ({type,label}) => <span className={`status ${type}`}><span className="dot"/> {label}</span>;

const SDG_COLORS = {'SDG 7':'#FCC30B','SDG 8':'#A21942','SDG 11':'#FD9D24','SDG 13':'#3F7E44','SDG 14':'#0A97D9','SDG 15':'#56C02B','SDG 17':'#19486A'};
const SDGBadge = ({sdg}) => <span style={{background:SDG_COLORS[sdg]||'#607D8B',color:'#fff',fontSize:9.5,padding:'2px 5px',borderRadius:3,fontWeight:700,marginRight:2,whiteSpace:'nowrap',display:'inline-block',marginBottom:2}}>{sdg}</span>;

// ─── SCREEN 0: HOME / PLATFORM OVERVIEW ──────────────────────────────────────

// ─── REGISTER PROJECT MODAL ───────────────────────────────────────────────────
const SDG_OPTIONS = ['SDG 7','SDG 8','SDG 11','SDG 13','SDG 14','SDG 15','SDG 17'];
const EMPTY_FORM = {name:'',country:'Kenya',tech:'Solar PV',capital:'',description:'',sdgs:[],ipRef:''};

const RegisterModal = ({onClose, onSave}) => {
  const [form, setForm] = useState(EMPTY_FORM);
  const [saved, setSaved] = useState(false);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const valid = form.name.trim() && form.capital.trim();

  const handleSave = () => {
    if(!valid) return;
    const flag = COUNTRY_FLAGS[form.country] || '🌍';
    const id = genId(form.country);
    onSave({
      id, name:form.name.trim(), country:form.country, flag,
      tech:form.tech, capital:`$${form.capital.replace(/[^0-9]/g,'')}`,
      score: Math.floor(Math.random()*15)+60, // indicative O1 score pending full assessment
      status:'pending', statusLabel:'Registered',
      sdgs: form.sdgs, co2:'Pending dMRV', ipRef:form.ipRef||'-'
    });
    setSaved(true);
  };

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        {saved ? (
          <div style={{textAlign:'center',padding:'16px 0'}}>
            <div style={{fontSize:48,marginBottom:12}}>✅</div>
            <div style={{fontSize:17,fontWeight:700,color:'var(--gn)',marginBottom:6}}>Project Registered</div>
            <div style={{fontSize:13,color:'var(--gr)',marginBottom:20}}>Your project has been added to the registry. An AI indicative match score will be assigned once the onboarding form is completed.</div>
            <button className="btn btn-teal" onClick={onClose}>Back to Registry</button>
          </div>
        ) : (
          <>
            <div className="modal-title">Register New Project</div>
            <div className="modal-sub">Enter project details. A Stellar contract ID will be auto-assigned on submission.</div>
            <div className="form-grid">
              <div className="form-field full">
                <label className="form-label">Project Name *</label>
                <input className="form-input" placeholder="e.g. Nairobi Community Solar Hub"
                  value={form.name} onChange={e=>set('name',e.target.value)}/>
              </div>
              <div className="form-field">
                <label className="form-label">Country *</label>
                <select className="form-select" value={form.country} onChange={e=>set('country',e.target.value)}>
                  {Object.keys(COUNTRY_FLAGS).map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label className="form-label">Technology Type *</label>
                <select className="form-select" value={form.tech} onChange={e=>set('tech',e.target.value)}>
                  {TECH_OPTIONS.map(t=><option key={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label className="form-label">Capital Required (USD) *</label>
                <input className="form-input" placeholder="e.g. 75000"
                  value={form.capital} onChange={e=>set('capital',e.target.value)}/>
              </div>
              <div className="form-field">
                <label className="form-label">Project Stage</label>
                <select className="form-select">
                  <option>Early Development</option><option>Feasibility Complete</option>
                  <option>Ready for Finance</option><option>Operational</option>
                </select>
              </div>
              <div className="form-field full">
                <label className="form-label">SDG Alignment (select all that apply)</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
                  {SDG_OPTIONS.map(s=>(
                    <label key={s} style={{display:'flex',alignItems:'center',gap:4,fontSize:12,cursor:'pointer',background:form.sdgs.includes(s)?SDG_COLORS[s]:'#f0f0f0',color:form.sdgs.includes(s)?'#fff':'#333',padding:'3px 9px',borderRadius:4,fontWeight:form.sdgs.includes(s)?700:400,transition:'all .15s'}}>
                      <input type="checkbox" style={{display:'none'}} checked={form.sdgs.includes(s)}
                        onChange={e=>set('sdgs', e.target.checked ? [...form.sdgs,s] : form.sdgs.filter(x=>x!==s))}/>
                      {s}
                    </label>
                  ))}
                </div>
              </div>
              <div className="form-field">
                <label className="form-label">WIPO PATENTSCOPE Reference (if applicable)</label>
                <input className="form-input" placeholder="e.g. WO2024/001234 or leave blank"
                  value={form.ipRef} onChange={e=>set('ipRef',e.target.value)}/>
              </div>
              <div className="form-field full">
                <label className="form-label">Brief Description</label>
                <input className="form-input" placeholder="One-line description of the project..."
                  value={form.description} onChange={e=>set('description',e.target.value)}/>
              </div>
              <div className="form-note">
                ℹ️ A Stellar contract ID (e.g. SC-KE-2026-xxxx) will be auto-generated. AI Stage O1 indicative match score runs automatically within 10 minutes of registration.
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={onClose}>Cancel</button>
              <button className="btn btn-green" onClick={handleSave}
                style={{opacity:valid?1:.5,cursor:valid?'pointer':'not-allowed'}}>
                Register Project
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ─── SCREEN 2: PROJECT REGISTRY ───────────────────────────────────────────────
const Registry = ({projects, onAdd}) => {
  const [query, setQuery] = useState('');
  const [techFilter, setTechFilter] = useState('All Technologies');
  const [statusFilter, setStatusFilter] = useState('All Statuses');
  const [showModal, setShowModal] = useState(false);

  const filtered = useMemo(() => projects.filter(p => {
    const q = query.toLowerCase();
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.country.toLowerCase().includes(q) || p.tech.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    const matchT = techFilter === 'All Technologies' || p.tech === techFilter;
    const matchS = statusFilter === 'All Statuses' || p.statusLabel.toLowerCase().includes(statusFilter.toLowerCase());
    return matchQ && matchT && matchS;
  }), [projects, query, techFilter, statusFilter]);

  const clear = () => { setQuery(''); setTechFilter('All Technologies'); setStatusFilter('All Statuses'); };

  const handleSave = (proj) => { onAdd(proj); };

  return (
    <div>
      {showModal && <RegisterModal onClose={()=>setShowModal(false)} onSave={p=>{handleSave(p);}}/>}
      <div className="page-title">Project &amp; IP Registry</div>
      <div className="page-sub">Registered climate projects and IP assets | Stellar contract IDs | {projects.length} projects total</div>

      <div className="search-bar">
        <input className="search-input" placeholder="Search by name, country, technology or contract ID..."
          value={query} onChange={e=>setQuery(e.target.value)}/>
        <select className="filter-select" value={techFilter} onChange={e=>setTechFilter(e.target.value)}>
          {TECHS.map(t=><option key={t}>{t}</option>)}
        </select>
        <select className="filter-select" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          {STATUSES.map(s=><option key={s}>{s}</option>)}
        </select>
        <button className="btn btn-teal" onClick={clear}>Clear</button>
        <button className="btn btn-green" onClick={()=>setShowModal(true)}>+ Register Project</button>
      </div>

      <div className="card">
        <div className="card-title">
          🗂️ Project Registry
          <span style={{marginLeft:'auto',fontSize:12,color:'var(--gr)',fontWeight:400}}>
            Showing {filtered.length} of {projects.length} projects
          </span>
        </div>
        {filtered.length === 0
          ? <div className="no-results">No projects match your filters. <span style={{color:'var(--md)',cursor:'pointer'}} onClick={clear}>Clear filters</span></div>
          : <table>
              <thead>
                <tr>
                  <th>Contract ID</th><th>Project Name</th><th>Country</th>
                  <th>Technology</th><th>SDG Tags</th><th>AI-Matched WIPO GREEN Tech.</th><th>CO₂ Impact</th><th>Capital</th><th>Match Score</th><th>Status</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(p=>(
                  <tr key={p.id}>
                    <td style={{fontFamily:'monospace',fontSize:11.5,color:'var(--md)'}}>{p.id}</td>
                    <td><strong>{p.name}</strong></td>
                    <td>{p.flag} {p.country}</td>
                    <td><span className="tag">{p.tech}</span></td>
                    <td style={{minWidth:90}}>{(p.sdgs||[]).map(s=><SDGBadge key={s} sdg={s}/>)}</td>
                    <td style={{fontSize:10.5}}>{p.ipUrl
                      ? <a href={p.ipUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--md)',textDecoration:'none',fontWeight:600}}>{p.ipRef} ↗</a>
                      : <span style={{color:'#ccc'}}>—</span>}
                    </td>
                    <td style={{fontSize:11.5,color:'var(--gn)',fontWeight:600}}>{p.co2||'—'}</td>
                    <td>{p.capital}</td>
                    <td>{p.status==='pending'
                      ? <span style={{fontSize:11,color:'var(--gr)'}}>Pending O1</span>
                      : <ScoreBar score={p.score}/>}
                    </td>
                    <td><Status type={p.status} label={p.statusLabel}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>
    </div>
  );
};

// ─── ZOOM STAGE CONFIG ───────────────────────────────────────────────────────
const ZOOM_SEQUENCE = [
  { id:'registry',  label:'Project Registration',    n:1, icon:'📋' },
  { id:'matching',  label:'AI Matching Engine',       n:2, icon:'🤖' },
  { id:'investor',  label:'Investor Review',          n:3, icon:'💼' },
  { id:'dlt',       label:'DLT Disbursement',         n:4, icon:'⛓️' },
];

// ─── ZOOM OVERLAY ─────────────────────────────────────────────────────────────
const ZoomOverlay = ({screenId, onClose, onNav, projects, addProject}) => {
  const idx = ZOOM_SEQUENCE.findIndex(s=>s.id===screenId);
  const current = ZOOM_SEQUENCE[idx] || ZOOM_SEQUENCE[0];
  const [animClass, setAnimClass] = useState('zoom-enter');
  const [slideClass, setSlideClass] = useState('screen-slide-in');
  const contentRef = useRef(null);

  // Keyboard: Escape = close, ArrowLeft/Right = navigate
  useEffect(()=>{
    const handler = (e)=>{
      if(e.key==='Escape'){ onClose(); }
      if(e.key==='ArrowRight' && idx < ZOOM_SEQUENCE.length-1){ onNav(ZOOM_SEQUENCE[idx+1].id,'fwd'); }
      if(e.key==='ArrowLeft'  && idx > 0)                     { onNav(ZOOM_SEQUENCE[idx-1].id,'back'); }
    };
    window.addEventListener('keydown', handler);
    return ()=>window.removeEventListener('keydown', handler);
  }, [idx]);

  const navigate = (targetId, dir) => {
    setSlideClass(dir==='fwd'?'screen-slide-in':'screen-slide-back');
    if(contentRef.current) contentRef.current.scrollTop = 0;
    onNav(targetId, dir);
  };

  const renderScreen = () => {
    switch(screenId) {
      case 'registry': return <Registry projects={projects} onAdd={addProject}/>;
      case 'investor': return <InvestorDashboard/>;
      case 'matching': return <MatchingEngine/>;
      case 'dlt':      return <DLT/>;
    }
  };

  return (
    <div className={`zoom-overlay ${animClass}`}>
      {/* Top nav bar */}
      <div className="zoom-bar">
        <button className="zoom-back-btn" onClick={onClose}>
          ✕ &nbsp;Overview
        </button>
        <div style={{width:1,height:24,background:'rgba(255,255,255,.15)'}}/>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{current.icon} &nbsp;Stage {current.n} — {current.label}</div>
          <div style={{fontSize:10,opacity:.5,fontFamily:'Consolas,monospace',letterSpacing:.5}}>ESC to return · ← → to navigate</div>
        </div>
        <div style={{flex:1}}/>
        {/* Step dots */}
        <div className="zoom-dots">
          {ZOOM_SEQUENCE.map((s,i)=>(
            <div key={s.id} className={`zoom-dot${i===idx?' on':''}`} title={s.label}
              onClick={()=>navigate(s.id, i>idx?'fwd':'back')}/>
          ))}
        </div>
        <div className="zoom-nav-btns">
          <button className="zoom-nav-btn"
            onClick={()=>navigate(ZOOM_SEQUENCE[idx-1].id,'back')}
            disabled={idx===0}>
            ← {idx>0?ZOOM_SEQUENCE[idx-1].icon+' '+ZOOM_SEQUENCE[idx-1].label:''}
          </button>
          <button className="zoom-nav-btn next"
            onClick={()=>navigate(ZOOM_SEQUENCE[idx+1].id,'fwd')}
            disabled={idx===ZOOM_SEQUENCE.length-1}>
            {idx<ZOOM_SEQUENCE.length-1?ZOOM_SEQUENCE[idx+1].icon+' '+ZOOM_SEQUENCE[idx+1].label:''} →
          </button>
        </div>
        <div style={{width:1,height:24,background:'rgba(255,255,255,.15)'}}/>
        <span className="zoom-key-hint">Stage {idx+1}/{ZOOM_SEQUENCE.length}</span>
      </div>
      {/* Screen content */}
      <div className={`zoom-content ${slideClass}`} ref={contentRef} key={screenId}>
        {renderScreen()}
      </div>
    </div>
  );
};

      </footer>

      {/* ZOOM OVERLAY — renders on top of everything */}
      {zoomed && (
        <ZoomOverlay

    </>
  );
}
